[build-system]
requires = ["setuptools>=41.2"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-meio-ambiente"
version = "0.2.0"
description = "Classificador de notícias e conteúdos ambientais com BERT + MLP."
readme = "README.md"
requires-python = ">=3.8"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py38"
line-length = 100
